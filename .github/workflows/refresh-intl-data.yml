name: Refresh Market Data Daily

on:
  schedule:
    # 每天 UTC 01:30（北京时间 09:30）更新行情数据
    - cron: "30 1 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Fetch international gold daily (Eastmoney/Yahoo)
        run: python3 scripts/fetch_intl_yahoo.py

      - name: Fetch domestic gold & merge (Tushare, token from secret)
        env:
          TUSHARE_TOKEN: ${{ secrets.TUSHARE_TOKEN }}
        run: python3 scripts/fetch_gold_data.py

      - name: Commit if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if ! git diff --quiet; then
            git add frontend/src/data/gold-prices.json
            git commit -m "chore: 每日自动更新行情数据"
            git push
          else
            echo "数据已是最新，跳过提交"
          fi
