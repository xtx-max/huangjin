name: Refresh International Gold Data

on:
  schedule:
    # 每周一 UTC 01:30（北京时间 09:30）补全国际金价日线
    - cron: "30 1 * * 1"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Fetch international gold daily from Yahoo
        run: python3 scripts/fetch_intl_yahoo.py

      - name: Commit if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if ! git diff --quiet; then
            git add frontend/src/data/gold-prices.json
            git commit -m "chore: 每周自动补全国际金价日线"
            git push
          else
            echo "数据已是最新，跳过提交"
          fi
