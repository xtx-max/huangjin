<svg width="100" height="100" viewBox="0 0 100 100" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="gold-gradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#FDB931;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#D4AF37;stop-opacity:1" />
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="2" dy="2" stdDeviation="2" flood-color="rgba(0,0,0,0.3)"/>
    </filter>
  </defs>
  
  <!-- Main Coin Body -->
  <circle cx="50" cy="50" r="45" fill="url(#gold-gradient)" stroke="#B8860B" stroke-width="2" filter="url(#shadow)"/>
  
  <!-- Inner Ring -->
  <circle cx="50" cy="50" r="38" fill="none" stroke="#FCE6A8" stroke-width="1" opacity="0.6"/>
  
  <!-- Chart Line (Rising) -->
  <path d="M28 65 L45 48 L58 58 L78 32" stroke="#FFF" stroke-width="5" stroke-linecap="round" stroke-linejoin="round" filter="url(#shadow)"/>
  
  <!-- Arrow Head -->
  <path d="M68 32 L78 32 L78 42" stroke="#FFF" stroke-width="5" stroke-linecap="round" stroke-linejoin="round" filter="url(#shadow)"/>
  
  <!-- Shine Effect -->
  <ellipse cx="35" cy="35" rx="10" ry="5" fill="#FFF" opacity="0.3" transform="rotate(-45 35 35)"/>
</svg>